name: CI

# Runs on Solstice CI (https://code.aopc.cloud/CloudNebulaProject/solstice-ci),
# a native Forgejo Actions runner that boots a fresh VM per job. Differences
# from GitHub Actions that shape this file:
#   * No `uses:` steps. The repo is cloned automatically; steps start in the
#     repo root. No actions/cache, no artifacts, no $GITHUB_PATH/$GITHUB_ENV.
#   * `needs:` is not honoured: every job is independent and starts at once.
#   * Compile caching comes from the images themselves: both the `rust` and
#     `illumos` images ship sccache, and the runner injects RUSTC_WRAPPER plus
#     the shared S3 backend into every step whenever `sccache` is on PATH.
#     The `rust` image also ships a pre-warmed cargo registry.
#
# Images (see the Solstice image catalog):
#   rust     Ubuntu 22.04 + stable rustup toolchain + sccache + build-essential,
#            libssl-dev, libprotobuf-dev, docker.  4 vCPU / 8 GB.
#   illumos  OpenIndiana Hipster + developer/lang/rustc + sccache +
#            build-essential (gcc, cmake, gnu-make, pkg-config).  4 vCPU / 8 GB.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sccache's S3 round trip on a cold VM can exceed the 10 s default.
  SCCACHE_STARTUP_TIMEOUT: "60"
  # Fresh VM every run: incremental artifacts are dead weight, and full
  # debuginfo for --all-targets of this workspace runs into many GB (the
  # illumos VM has 8 GB RAM / a ~40 GB disk). Line tables keep backtraces.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  linux:
    name: Linux (fmt / clippy / nextest / e2e / docs)
    runs-on: rust
    steps:
      - name: Toolchain
        run: |
          rustc -Vv
          cargo -V
          command -v sccache && sccache --version || echo "sccache not on PATH"

      - name: Install cargo-nextest
        # Tests need process isolation (port conflicts); CLAUDE.md mandates nextest.
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version

      - name: Operator book (source and links; mdbook build if installed)
        # Same check as the release gate. check-book.sh needs only sh and
        # awk; the rust image does not ship mdbook and CI does not download
        # unpinned tools, so the HTML build runs only if the image has it.
        run: |
          set -euo pipefail
          docs/book/test-check-book.sh
          docs/book/check-book.sh
          if command -v mdbook >/dev/null 2>&1; then
            mdbook --version
            mdbook build docs/book -d "${PWD}/target/book"
          else
            echo "mdbook not installed: book source and link check only"
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (report only)
        # libips currently carries ~270 clippy findings (mostly
        # result_large_err and collapsible_if), so warnings are not denied yet.
        # Tracked in the "Make the workspace clippy-clean" ticket; flip to
        # `-- -D warnings` once that lands.
        # clippy-report.sh keeps the log bounded: diagnostics go to JSON and
        # the step prints per-lint counts, one line per warning (capped),
        # every error in full and cargo's stderr tail on failure. The exit
        # status is clippy's own.
        run: |
          set -euo pipefail
          .forgejo/scripts/tests/test-clippy-report.sh
          .forgejo/scripts/clippy-report.sh --workspace --all-targets --all-features --locked

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test inventory (required suites present, nothing skipped)
        # Same check as the release gate (.forgejo/scripts/release-lib.sh).
        run: |
          set -euo pipefail
          . .forgejo/scripts/release-lib.sh
          cargo nextest list --workspace --locked --message-format json > target/nextest-list.json
          release_check_test_inventory target/nextest-list.json

      - name: Test (nextest, whole workspace incl. pkg6repo e2e)
        # The pkg6repo e2e_tests target is self-contained (it drives the
        # pkg6repo binary Cargo builds for the test profile), so the workspace
        # run covers it; no separate xtask e2e step is needed.
        run: cargo nextest run --workspace --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --locked

  illumos:
    name: illumos (OpenIndiana) build + nextest
    runs-on: illumos
    steps:
      - name: Toolchain and host resources
        run: |
          uname -a
          rustc -Vv
          cargo -V
          command -v sccache && sccache --version || echo "sccache not on PATH"
          prtconf 2>/dev/null | grep -i memory || true
          swap -l || true
          df -h /export/home /tmp || true
          zfs list -o name,used,avail,refer,mountpoint 2>/dev/null | head -20 || true

      - name: Install cargo-nextest
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -LsSf https://get.nexte.st/latest/illumos | gtar zxf - -C "$HOME/.cargo/bin"
          PATH="$HOME/.cargo/bin:$PATH" cargo nextest --version

      - name: Build (bins and libs)
        # aws-lc-sys (via rustls / jsonwebtoken) has no illumos-specific
        # pregenerated bindings but ships universal ones since aws-lc-rs 1.15,
        # so no bindgen/libclang is needed; it builds through cmake + gcc from
        # build-essential. See docs/research/illumos-crypto-stack.md (#35).
        # On failure, dump disk and memory state: a silent `ld returned 1`
        # with no diagnostic is usually ENOSPC or memory pressure on the VM.
        run: |
          cargo build --workspace --locked || {
            echo "=== build failed; host state ==="; df -h /export/home /tmp; swap -l; zfs list 2>/dev/null | head; du -sh target 2>/dev/null; exit 1; }

      - name: Build (test targets)
        run: |
          cargo build --workspace --all-targets --locked || {
            echo "=== build failed; host state ==="; df -h /export/home /tmp; swap -l; zfs list 2>/dev/null | head; du -sh target 2>/dev/null; exit 1; }

      - name: Test (nextest, whole workspace incl. pkg6repo e2e)
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo nextest run --workspace --locked
