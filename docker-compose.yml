services:
  pkg6depotd:
    build: .
    container_name: pkg6depotd
    restart: unless-stopped
    volumes:
      - ./repo:/var/pkg/repo:ro
    expose:
      - "8080"
    environment:
      - VIRTUAL_HOST=pkg.solstice-ci.org
      - VIRTUAL_PORT=8080
    networks:
      - solstice-ci_core

networks:
  solstice-ci_core:
    external: true
